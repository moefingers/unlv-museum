<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verified banner experiments</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0b0c;
        --fg: #e8e8ea;
        --muted: #8a8a90;
        --card: #16161a;
        --border: #2a2a30;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #111;
          --muted: #666;
          --card: #fff;
          --border: #e2e2e2;
        }
      }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
      body { font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
      .lede { color: var(--muted); margin: 0 0 24px; max-width: 700px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .frame {
        background: repeating-conic-gradient(rgba(127,127,127,0.08) 0% 25%, transparent 0% 50%) 50% / 16px 16px;
        display: grid;
        place-items: center;
        padding: 8px;
        min-height: 160px;
      }
      .frame img { display: block; max-width: 100%; height: auto; }
      figcaption {
        padding: 8px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        word-break: break-all;
      }
      figcaption a { color: inherit; text-decoration: none; }
      figcaption a:hover { color: var(--fg); }
      .back { color: var(--muted); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 12px; }
      .back:hover { color: var(--fg); }
    </style>
  </head>
  <body>
    <a class="back" href="/experiments">← back to experiments</a>
    <h1>Verified banner experiments</h1>
    <p class="lede">Each SVG demonstrates one technique in isolation, with the success criterion baked into the image. If the visual matches the "Expected" line, that primitive/technique works in this environment. Combinations come later.</p>
    <div class="grid" id="grid"></div>

    <script>
      const files = [
        "01-dot-translates-lr.svg",
        "02-dot-orbits-motion-path.svg",
        "03-dot-pulses-r.svg",
        "04-group-rotates.svg",
        "05-phase-offset-dots.svg",
        "06-fibonacci-static-dots.svg",
        "06.1-fibonacci-dots-y-axis.svg",
        "06.2-fibonacci-dots-x-axis.svg",
        "06.3-fibonacci-dots-yz45.svg",
        "07-fibonacci-rotates-2d.svg",
        "08-perspective-depth-sizes.svg",
        "09-single-triangle.svg",
        "10-static-2d-triangle-mesh.svg",
        "11-globe-latlon-static.svg",
        "11.1-globe-spin-y-axis.svg",
        "11.2-tumble-x-axis.svg",
        "11.3-tilted-axis-yz45.svg",
        "12-globe-latlon-rotates-2d.svg",
        "13-icosahedron-static.svg",
        "13.1-icosahedron-y-axis.svg",
        "13.2-icosahedron-x-axis.svg",
        "13.3-icosahedron-yz45.svg",
        "14-fibonacci-knn-edges.svg",
        "14.1-fibonacci-knn-y-axis.svg",
        "14.2-fibonacci-knn-x-axis.svg",
        "14.3-fibonacci-knn-yz45.svg",
        "15-whole-scale-breathing.svg",
        "16-per-vertex-wobble.svg",
        "17-2d-rim-bias-dots.svg",
        "18-2d-rim-knn-mesh.svg",
      ];

      const grid = document.getElementById("grid");

      // Resolve filenames to absolute paths so they work whether the URL
      // ends with a trailing slash or not (Vercel strips it by default).
      const basePath = location.pathname.replace(/\/[^/]*$/, '') + '/';
      const figs = files.map((name) => {
        const href = basePath + encodeURI(name);
        const fig = document.createElement("figure");
        fig.dataset.href = href;
        fig.dataset.name = name;
        fig.innerHTML = `
          <div class="frame" data-frame></div>
          <figcaption><a href="${href}" target="_blank" rel="noopener">${name}</a></figcaption>
        `;
        grid.appendChild(fig);
        return fig;
      });

      const mount = (fig) => {
        const frame = fig.querySelector("[data-frame]");
        if (frame.firstChild) return;
        const img = document.createElement("img");
        img.src = fig.dataset.href;
        img.alt = fig.dataset.name;
        img.loading = "lazy";
        img.decoding = "async";
        frame.appendChild(img);
      };

      const unmount = (fig) => {
        const frame = fig.querySelector("[data-frame]");
        frame.replaceChildren();
      };

      const io = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            if (e.isIntersecting) mount(e.target);
            else unmount(e.target);
          }
        },
        { rootMargin: "300px 0px", threshold: 0 }
      );

      for (const fig of figs) io.observe(fig);
    </script>
  </body>
</html>
