  <path d="M460.0,220.0 C460.0,253.1 433.1,280.0 400.0,280.0 C366.9,280.0 340.0,253.1 340.0,220.0 C340.0,186.9 366.9,160.0 400.0,160.0 C433.1,160.0 460.0,186.9 460.0,220.0 Z" fill="none" stroke="#222" stroke-dasharray="2 4"/>
