<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="SMIL textContent counter">
  <style>
    .bg { fill: #0a0a0a; }
    .label { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a3a3a3; letter-spacing: 0.04em; text-transform: uppercase; }
    .title { font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fafafa; }
    .sub   { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #737373; }
    .num   { font: 800 56px ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace; fill: #a78bfa; }
  </style>
  <rect class="bg" width="800" height="180"/>
  <text class="label" x="40" y="46">Experiment 04</text>
  <text class="title" x="40" y="86">SMIL — text counter (the dynimage trick)</text>
  <text class="sub"   x="40" y="130">animate attributeName="textContent" with discrete values + fill="freeze"</text>
  <text class="num" x="760" y="110" text-anchor="end">
    412
    <animate attributeName="textContent"
             values="0;47;138;221;347;412"
             dur="1.6s"
             calcMode="discrete"
             fill="freeze"
             begin="0.2s"/>
  </text>
</svg>
