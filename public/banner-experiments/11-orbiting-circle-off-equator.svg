<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Circle at 35°N latitude orbiting a tilted sphere">
  <defs>
    <radialGradient id="marker" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#bae6fd"/>
      <stop offset="60%"  stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <style>
      .bg     { fill: #0a0a0a; }
      .label  { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a3a3a3; letter-spacing: 0.05em; text-transform: uppercase; }
      .title  { font: 700 24px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fafafa; }
      .sub    { font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #737373; }
      .axis   { stroke: #262626; stroke-width: 1; stroke-dasharray: 3 5; }
      .equator{ fill: none; stroke: #1f1f1f; stroke-width: 1; }
      .parallel { fill: none; stroke: #1e3a5f; stroke-width: 1; stroke-dasharray: 1 2; }
      .sphere { fill: none; stroke: #262626; stroke-width: 1; stroke-dasharray: 2 4; }
    </style>
  </defs>

  <rect class="bg" width="800" height="280"/>

  <text class="label" x="40" y="40">Experiment 11</text>
  <text class="title" x="40" y="72">Circle at 35°N — orbiting at non-equatorial latitude</text>
  <text class="sub"   x="40" y="100">Marker traces a parallel-of-latitude (smaller radius, higher on screen).</text>
  <text class="sub"   x="40" y="120">Visible 59% of the cycle vs 50% on the equator — latitude tilt keeps it facing camera longer.</text>

