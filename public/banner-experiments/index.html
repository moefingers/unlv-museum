<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banner experiments</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0b0c;
        --fg: #e8e8ea;
        --muted: #8a8a90;
        --card: #16161a;
        --border: #2a2a30;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #111;
          --muted: #666;
          --card: #fff;
          --border: #e2e2e2;
        }
      }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
      body { font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 16px; font-weight: 600; }
      .meta { color: var(--muted); margin-bottom: 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .frame {
        background: repeating-conic-gradient(rgba(127,127,127,0.08) 0% 25%, transparent 0% 50%) 50% / 16px 16px;
        display: grid;
        place-items: center;
        padding: 12px;
        min-height: 160px;
      }
      .frame img, .frame object { display: block; max-width: 100%; height: auto; }
      figcaption {
        padding: 8px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        word-break: break-all;
      }
      figcaption a { color: inherit; text-decoration: none; }
      figcaption a:hover { color: var(--fg); }
    </style>
  </head>
  <body>
    <h1>Banner experiments</h1>
    <p class="meta" id="meta">Loading…</p>
    <div class="grid" id="grid"></div>

    <script>
      const files = [
        "01-css-pulse.svg",
        "02-smil-rotation.svg",
        "03-color-cycle.svg",
        "04-counter.svg",
        "05-sheen.svg",
        "06-globe.svg",
        "07-theme-responsive.svg",
        "08-compound-banner.svg",
        "09-orbiting-cards-backup.svg",
        "09-orbiting-cards.svg",
        "10-orbiting-circles.svg",
        "11-orbiting-circle-off-equator -backup.svg",
        "11-orbiting-circle-off-equator.svg",
        "12-fibonacci-circles-100.svg",
        "12-fibonacci-circles-300.svg",
        "12-fibonacci-circles.svg",
        "13-shaded-markers.svg",
        "14-bbox-light-shading-300.svg",
        "14-bbox-light-shading-400-l.svg",
        "14-bbox-light-shading-400-l2.svg",
        "14-bbox-light-shading-400.svg",
        "14-bbox-light-shading.svg",
        "15-multi-80x140x14_400x60x3@6s.svg",
        "15-multi-100x100x14.svg",
        "15-multi-200x140x9@24s_100x85x6@12s_50x40x5@6s.svg",
        "15-multi-200x140x9@24s_tX25_tZ30_200x50x6_tX25_tZ-30.svg",
        "15-multi-200x140x10@36s_80x90x6@14s_30x45x4@5s.svg",
        "15-multi-300x140x9_100x100x14.svg",
        "15-multi-300x140x9_150x50x6.svg",
        "15-multi-300x140x9_150x50x6@-12s.svg",
        "15-multi-300x140x9_150x50x6@3s.svg",
        "15-multi-300x140x9_150x100x6.svg",
        "15-multi-300x140x9_tX18_tZ0_150x50x6@9s_tX18_tZ90.svg",
        "15-multi-300x140x9_tX20_tZ30.svg",
        "15-multi-300x140x9_tX20_tZ45.svg",
        "15-multi-300x140x9@24s_150x50x6@8s.svg",
        "16-axis-200x140x9-nod_80x60x6-precessx3.svg",
        "16-axis-200x140x9-precess_100x80x6-nutate_40x35x4-tumble.svg",
        "16-axis-200x140x9-precess_100x80x6-nutate_50x35x4-precess.svg",
        "16-axis-200x140x9-precess_100x80x6-nutate_50x35x4-tumble_30x18x2-tumble.svg",
        "16-axis-200x140x9-precess_100x80x6-nutate_50x35x4-tumble_light-arc.svg",
        "16-axis-200x140x9-precess_100x80x6-nutate_50x35x4-tumble_light-orbit.svg",
        "16-axis-200x140x9-precess_100x80x6-nutate_50x35x4-tumble_light-sway.svg",
        "16-axis-200x140x9-precess_100x80x6-nutate_50x35x4-tumble.svg",
        "16-axis-200x140x9-precess@30s_100x80x6-nutate_50x35x4-tumble@4s.svg",
        "16-axis-200x140x9-precess@30s_100x80x6-nutate@15s_50x35x4-tumble@5s.svg",
        "16-axis-200x140x9-tumble_100x80x6-nutate_50x35x4-precess.svg",
        "16-axis-300x140x9-nutate_150x50x6-wobble.svg",
        "16-axis-300x140x9-precess_150x50x6-static.svg",
        "16-axis-300x140x9-precess.svg",
        "16-axis-300x140x9-static_150x50x6-tumble.svg",
        "16-axis-300x140x9-wobble_150x50x6-precess.svg",
        "16-axis-nod-300x140x9.svg",
        "16-axis-nutate-300x140x9.svg",
        "16-axis-precess-200x140x9_80x60x6.svg",
        "16-axis-precess-300x140x9.svg",
        "16-axis-tumble-300x140x9.svg",
        "16-axis-wobble-300x140x9.svg",
        "17-light-arc-front_200x140x9_100x80x6_50x35x4.svg",
        "17-light-pendulum_200x140x9_100x80x6_50x35x4.svg",
        "17-light-tilted-orbit_200x140x9_100x80x6_50x35x4.svg",
        "17-light-tilted-orbit-point180_200x140x9_100x80x6_50x35x4.svg",
        "17-light-tilted-orbit-point260_200x140x9_100x80x6_50x35x4.svg",
        "17-light-tilted-orbitx3_200x140x9_100x80x6_50x35x4.svg",
        "18-axislight-arc-front_200x140x9-precess@30s_100x80x6-nutate_50x35x4-tumble@6s.svg",
        "18-axislight-orbit_200x140x9-precess@30s_100x80x6-nutate_50x35x4-tumble@6s.svg",
        "18-axislight-pendulumx2_200x140x9-precess@30s_100x80x6-nutate_50x35x4-tumble@6s.svg",
        "18-axislight-tilted-orbit_200x140x9-precess@30s_100x80x6-nutate_50x35x4-tumble@6s.svg",
        "18-axislight-tilted-orbit-point240_200x140x9-precess@30s_100x80x6-nutate_50x35x4-tumble@6s.svg",
      ];

      const grid = document.getElementById("grid");
      const meta = document.getElementById("meta");
      meta.textContent = `${files.length} SVGs — only mounted while visible`;

      const figs = files.map((name) => {
        const href = encodeURI(name);
        const fig = document.createElement("figure");
        fig.dataset.href = href;
        fig.dataset.name = name;
        fig.innerHTML = `
          <div class="frame" data-frame></div>
          <figcaption><a href="${href}" target="_blank" rel="noopener">${name}</a></figcaption>
        `;
        grid.appendChild(fig);
        return fig;
      });

      const mount = (fig) => {
        const frame = fig.querySelector("[data-frame]");
        if (frame.firstChild) return;
        const img = document.createElement("img");
        img.src = fig.dataset.href;
        img.alt = fig.dataset.name;
        img.loading = "lazy";
        img.decoding = "async";
        frame.appendChild(img);
      };

      const unmount = (fig) => {
        const frame = fig.querySelector("[data-frame]");
        frame.replaceChildren();
      };

      const io = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            if (e.isIntersecting) mount(e.target);
            else unmount(e.target);
          }
        },
        { rootMargin: "200px 0px", threshold: 0 }
      );

      for (const fig of figs) io.observe(fig);
    </script>
  </body>
</html>
