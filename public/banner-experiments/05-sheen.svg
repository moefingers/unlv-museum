<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="Sheen gradient sweep">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <style>
      .label { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a3a3a3; letter-spacing: 0.04em; text-transform: uppercase; }
      .title { font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fafafa; }
      .sub   { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c7d2fe; }
    </style>
  </defs>
  <rect width="800" height="180" fill="url(#bg)"/>
  <rect width="800" height="180" fill="url(#sheen)">
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="800 0" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <text class="label" x="40" y="46">Experiment 05</text>
  <text class="title" x="40" y="86">Sheen sweep — gradient + translate animation</text>
  <text class="sub"   x="40" y="130">Same primitive dynimage uses on the commits card backdrop</text>
</svg>
