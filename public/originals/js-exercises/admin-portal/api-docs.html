<!DOCTYPE html>
<html>
  <head>
    <title>API Documentation</title>
    <!-- needed for adaptive design -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">

    <!--
    ReDoc doesn't change outer page styles
    -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <redoc spec-url='./api.schema.json'></redoc>
    <!--
      Hosting fix (museum-ready/original): the original script src was
      `https://cdn.jsdelivr.net/npm/redoc@next/bundles/redoc.standalone.js`.
      The `@next` dist-tag was deprecated upstream and now 404s, AND
      cross-origin fetches were CORB-blocked when the page was iframed.
      Vendoring the bundle to ./vendor/redoc.standalone.js (pinned to
      redoc@2.5.2 — current latest as of 2026-05-24) keeps the page
      working forever without any CDN dependency.
    -->
    <script src="./vendor/redoc.standalone.js"> </script>
  </body>
</html>
