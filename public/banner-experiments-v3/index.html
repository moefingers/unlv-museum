<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banner experiments v3</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0b0c;
        --fg: #e8e8ea;
        --muted: #8a8a90;
        --card: #16161a;
        --border: #2a2a30;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #111;
          --muted: #666;
          --card: #fff;
          --border: #e2e2e2;
        }
      }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
      body { font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 16px; font-weight: 600; }
      .meta { color: var(--muted); margin-bottom: 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .frame {
        background: repeating-conic-gradient(rgba(127,127,127,0.08) 0% 25%, transparent 0% 50%) 50% / 16px 16px;
        display: grid;
        place-items: center;
        padding: 12px;
        min-height: 160px;
      }
      .frame img, .frame object { display: block; max-width: 100%; height: auto; }
      figcaption {
        padding: 8px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        word-break: break-all;
      }
      figcaption a { color: inherit; text-decoration: none; }
      figcaption a:hover { color: var(--fg); }
      .back { color: var(--muted); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 12px; }
      .back:hover { color: var(--fg); }
    </style>
  </head>
  <body>
    <a class="back" href="/experiments">← back to experiments</a>
    <h1>Banner experiments v3 — multi-sphere, per-bead L recompute</h1>
    <p class="meta" id="meta">Loading…</p>
    <div class="grid" id="grid"></div>

    <script>
      const files = [
        "v3-300x140x9-staticx1_150x80x6-staticx-1@24s_60x35x4-precess@12s.svg",
      ];

      const grid = document.getElementById("grid");
      const meta = document.getElementById("meta");
      meta.textContent = `${files.length} SVGs — only mounted while visible`;

      const figs = files.map((name) => {
        const href = encodeURI(name);
        const fig = document.createElement("figure");
        fig.dataset.href = href;
        fig.dataset.name = name;
        fig.innerHTML = `
          <div class="frame" data-frame></div>
          <figcaption><a href="${href}" target="_blank" rel="noopener">${name}</a></figcaption>
        `;
        grid.appendChild(fig);
        return fig;
      });

      const mount = (fig) => {
        const frame = fig.querySelector("[data-frame]");
        if (frame.firstChild) return;
        const img = document.createElement("img");
        img.src = fig.dataset.href;
        img.alt = fig.dataset.name;
        img.loading = "lazy";
        img.decoding = "async";
        frame.appendChild(img);
      };

      const unmount = (fig) => {
        const frame = fig.querySelector("[data-frame]");
        frame.replaceChildren();
      };

      const io = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            if (e.isIntersecting) mount(e.target);
            else unmount(e.target);
          }
        },
        { rootMargin: "200px 0px", threshold: 0 }
      );

      for (const fig of figs) io.observe(fig);
    </script>
  </body>
</html>
