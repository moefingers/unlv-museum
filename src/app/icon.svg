<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    :root { --edge: oklch(0.55 0.22 250); }
    @media (prefers-color-scheme: dark) { :root { --edge: oklch(0.78 0.20 250); } }
  </style>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="oklch(0.92 0.10 250)" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="var(--edge)" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <!-- Hexagon: pointy-top, inscribed in r=10 from center (12,12) -->
  <polygon
    points="12,2 20.66,7 20.66,17 12,22 3.34,17 3.34,7"
    stroke="url(#core)"
    stroke-width="1.6"
    fill="none"/>
  <!-- Triangle: inscribed touching three alternating hex vertices (top, bottom-right, bottom-left) -->
  <polygon
    points="12,2 20.66,17 3.34,17"
    stroke="url(#core)"
    stroke-width="1.4"
    fill="none"/>
</svg>
